<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Tạo link mời riêng · Lân & Thanh</title>
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <style>
      :root {
        --paper: #fcfaf7;
        --ink: #2b2724;
        --ink-3: #978d82;
        --green: #33503c;
        --line: rgba(43, 39, 36, 0.16);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 2.4rem 1.2rem 4rem;
        background: var(--paper);
        color: var(--ink);
        font: 400 16px/1.7 'Segoe UI', system-ui, sans-serif;
      }
      main { width: min(100%, 720px); margin-inline: auto; }
      h1 { font-size: 1.5rem; font-weight: 500; margin: 0 0 0.3rem; }
      p.sub { color: var(--ink-3); margin: 0 0 2rem; font-size: 0.92rem; }
      label { display: block; font-size: 0.74rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--green); margin-bottom: 0.4rem; }
      textarea, input {
        width: 100%; padding: 0.8rem 0.9rem; font: inherit; color: inherit;
        background: #fff; border: 1px solid var(--line); border-radius: 3px;
      }
      textarea { min-height: 150px; resize: vertical; }
      .row { margin-bottom: 1.3rem; }
      button {
        padding: 0.75rem 1.5rem; font: inherit; font-size: 0.78rem; letter-spacing: 0.16em;
        text-transform: uppercase; color: #fff; background: var(--green);
        border: 0; border-radius: 999px; cursor: pointer;
      }
      button.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
      .out { margin-top: 1.6rem; display: grid; gap: 0.6rem; }
      .item { display: flex; gap: 0.7rem; align-items: center; padding: 0.7rem 0.9rem; background: #fff; border: 1px solid var(--line); border-radius: 3px; }
      .item b { font-weight: 500; min-width: 32%; }
      .item a { flex: 1; color: var(--green); font-size: 0.82rem; word-break: break-all; text-decoration: none; }
      .item button { padding: 0.4rem 0.8rem; font-size: 0.66rem; }
      .hint { font-size: 0.82rem; color: var(--ink-3); }
    </style>
  </head>
  <body>
    <main>
      <h1>Tạo link mời riêng</h1>
      <p class="sub">Mỗi khách một đường dẫn, mở ra là thấy tên mình trên thiệp.</p>

      <div class="row">
        <label for="base">Địa chỉ thiệp</label>
        <input id="base" type="url" />
      </div>

      <div class="row">
        <label for="names">Danh sách khách (mỗi dòng một tên)</label>
        <textarea id="names" placeholder="Anh Nam &#43; Gia đình&#10;Cô Tư&#10;Bạn Minh &#43; 1"></textarea>
      </div>

      <button id="make" type="button">Tạo link</button>
      <button id="copyAll" class="ghost" type="button">Chép tất cả</button>

      <div class="out" id="out"></div>
      <p class="hint" id="hint"></p>
    </main>

    <script>
      const base = document.getElementById('base');
      const names = document.getElementById('names');
      const out = document.getElementById('out');
      const hint = document.getElementById('hint');
      base.value = location.origin + '/';

      function linkFor(name) {
        const url = new URL(base.value || location.origin);
        url.searchParams.set('to', name);
        return url.toString();
      }

      function copy(text, node) {
        navigator.clipboard.writeText(text).then(() => {
          const old = node.textContent;
          node.textContent = 'Đã chép';
          setTimeout(() => { node.textContent = old; }, 1400);
        });
      }

      function render() {
        const list = names.value.split('\n').map((s) => s.trim()).filter(Boolean);
        out.replaceChildren();
        list.forEach((name) => {
          const url = linkFor(name);
          const row = document.createElement('div');
          row.className = 'item';
          const who = document.createElement('b');
          who.textContent = name;
          const a = document.createElement('a');
          a.href = url;
          a.target = '_blank';
          a.rel = 'noopener';
          a.textContent = url;
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.textContent = 'Chép';
          btn.addEventListener('click', () => copy(url, btn));
          row.append(who, a, btn);
          out.append(row);
        });
        hint.textContent = list.length ? list.length + ' link đã sẵn sàng.' : 'Chưa có tên nào.';
      }

      document.getElementById('make').addEventListener('click', render);
      document.getElementById('copyAll').addEventListener('click', () => {
        const list = names.value.split('\n').map((s) => s.trim()).filter(Boolean);
        const text = list.map((n) => n + '\t' + linkFor(n)).join('\n');
        copy(text, document.getElementById('copyAll'));
      });
    </script>
  </body>
</html>
